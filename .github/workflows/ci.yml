name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege: default to read-only for every job.
# Individual jobs can opt into more permissions if needed.
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff==0.15.9"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # mypy loads Django settings during type inference; it never hits a DB.
      SECRET_KEY: test-secret-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: mypy
        run: mypy apps/ config/ providers/ tests/ --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pulled via AWS's public mirror of Docker Hub official images —
        # avoids anonymous Docker Hub pulls, whose timeouts/rate limits
        # broke main CI on 2026-06-10 (run 27262568530).
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: brightbean_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-secret-key-not-for-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brightbean_test
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest --cov=apps --cov-report=term-missing

  # THIS JOB HAS NEVER RUN ANYWHERE. It needs a GitHub runner, so the first
  # push is its first execution - and `build` gates on it, so if it comes up red
  # for an environmental reason (the apt layout under /usr/lib/postgresql,
  # playwright's system deps, the timeout against initdb + a Chromium download)
  # then nothing in the repository can merge until it is fixed.
  #
  # If that happens: take `e2e` out of `build.needs`, fix it, and put it back
  # once it has been green once. Do not debug it with main blocked.
  e2e:
    name: End-to-end (browser + ephemeral Postgres)
    runs-on: ubuntu-latest
    # THE SUITE TAKES 7:25 on the machine that last measured it, and this job
    # does four more slow things before it starts: pip install, an npm build,
    # a Chromium download with its system dependencies, and an apt install of
    # the PostgreSQL server binaries. That fits inside twenty minutes on paper
    # and sits close to it on a runner, which is slower than the machine that
    # produced the number - and a timeout here would read as a product failure
    # while being nothing of the kind.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # THE BROWSER SUITE IS INVALID WITHOUT THE COMPILED ASSETS, and this job
      # has never had them. Tailwind's stylesheet is BUILT, not committed -
      # theme/static/css/dist/ is in .gitignore - so every page this job
      # rendered was unstyled: the layout was not the one that ships, elements
      # sat where they never sit in production, and Playwright's actionability
      # checks passed against something no customer has ever seen.
      #
      # requirements/end-to-end-testing.md states this as a rule and names
      # these two commands. They were simply never added here.
      #
      # No actions/setup-node: every action in this file is pinned by SHA, and
      # the ubuntu-latest image already ships Node, so this needs no new pin.
      - name: Build the front-end assets
        run: npm ci && npm run build
        working-directory: theme/static_src

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.e2e
          SECRET_KEY: test-secret-key-not-for-production

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The suite creates and destroys its OWN cluster with initdb/pg_ctl, so
      # what is needed is the server BINARIES, not a running server. A
      # `services:` container would not do: the fixture has to run initdb
      # itself, and tests/e2e/conftest.py looks under /usr/lib/postgresql/*/bin.
      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      # -m on the command line overrides the `-m 'not e2e'` in addopts, and
      # --ds is NOT optional: config/settings/test.py runs CSP report-only,
      # under which a blocked-script defect cannot reproduce.
      - name: pytest -m e2e
        run: pytest -m e2e --ds=config.settings.e2e tests/e2e

  build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          tags: brightbean:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # We invoke the gitleaks binary directly rather than using
    # gitleaks/gitleaks-action, because that action now requires a paid
    # license for GitHub organizations. The binary itself remains free
    # and open source under the MIT license.
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner
